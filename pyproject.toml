[project]
name = "kreppa"
version = "0.1.0"
description = "Public-data Iceland economic stress dashboard pipeline"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "requests>=2.31"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
